<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <defs>
    <linearGradient id="zg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0D3B66"/>
      <stop offset="100%" stop-color="#1A6BA8"/>
    </linearGradient>
    <linearGradient id="zg-light" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2EA5E9"/>
      <stop offset="100%" stop-color="#1A82C4"/>
    </linearGradient>
  </defs>

  <!-- 外层：云朵轮廓 + 盾形底座 融合体 -->
  <path d="M24 4
           C16 4 10 8 8 13
           C5 14 3 17 3 20.5
           C3 25 6.5 28.5 11 29
           C11.5 35 16 40 24 40
           C32 40 36.5 35 37 29
           C41.5 28.5 45 25 45 20.5
           C45 17 43 14 40 13
           C38 8 32 4 24 4Z"
        fill="url(#zg)"/>

  <!-- 内层镂空：云朵负空间 + 密钥孔 -->
  <path d="M24 10
           C19 10 15 12.5 13.5 16
           C11.5 16.5 10 18.5 10 21
           C10 23.8 12.2 26 15 26.3
           C15.3 30 18.5 33 24 33
           C29.5 33 32.7 30 33 26.3
           C35.8 26 38 23.8 38 21
           C38 18.5 36.5 16.5 34.5 16
           C33 12.5 29 10 24 10Z"
        fill="url(#zg-light)" opacity=".95"/>

  <!-- 中心：抽象密钥/密码符号（Z 字母变体 + 圆点 = ZHUOYUN 首字母 + 密码学） -->
  <g transform="translate(24,21.5)">
    <!-- 横杠上 -->
    <rect x="-6" y="-5" width="12" height="2.2" rx="1.1" fill="#fff"/>
    <!-- 斜杠（Z 的斜线） -->
    <rect x="-5.5" y="-2" width="11" height="2.2" rx="1.1" fill="#fff"
          transform="rotate(28)"/>
    <!-- 横杠下 -->
    <rect x="-6" y="2.8" width="12" height="2.2" rx="1.1" fill="#fff"/>
    <!-- 密钥圆点 -->
    <circle cx="6.5" cy="-3.8" r="2" fill="#fff"/>
  </g>

  <!-- 底部装饰：三道横线代表"数据/密码流"的稳定性 -->
  <g opacity=".35">
    <line x1="17" y1="42" x2="31" y2="42" stroke="#0D3B66" stroke-width="1.8" stroke-linecap="round"/>
    <line x1="19" y1="44.5" x2="29" y2="44.5" stroke="#0D3B66" stroke-width="1.4" stroke-linecap="round"/>
  </g>
</svg>
